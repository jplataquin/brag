<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
    <defs>
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <g transform="translate(10, 10) scale(0.9)">
        <rect width="100" height="100" rx="25" fill="#111122" stroke="#00f0ff" stroke-width="3" filter="url(#glow-cyan)"/>
        <path d="M30 20 L60 20 C 75 20, 75 45, 60 45 L30 45 Z" fill="none" stroke="#ff00ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-magenta)"/>
        <path d="M30 45 L65 45 C 85 45, 85 80, 65 80 L30 80 Z" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)"/>
        <line x1="30" y1="20" x2="30" y2="80" stroke="#ffffff" stroke-width="8" stroke-linecap="round" filter="url(#glow-cyan)"/>
    </g>

    <text x="130" y="70" font-family="'Orbitron', sans-serif, system-ui" font-weight="900" font-size="64" fill="#ffffff" filter="url(#glow-cyan)" letter-spacing="4">
        BRAG
    </text>
    
    <text x="135" y="105" font-family="sans-serif, system-ui" font-weight="600" font-size="14" fill="#ffdd00" letter-spacing="3" filter="url(#glow-magenta)">
        FORGE. BATTLE. BRAG.
    </text>
</svg>