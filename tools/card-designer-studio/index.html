<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brag - Card Designer Studio</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black border-bottom border-neon-cyan">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 ps-3" style="font-family: 'Orbitron', sans-serif; letter-spacing: 2px;">
            <i class="bi bi-gem text-neon-cyan me-2"></i> BRAG <span class="text-neon-cyan">STUDIO</span> <span id="studio-version-tag" class="ms-2 badge bg-dark border border-secondary text-secondary" style="font-size: 0.6rem; vertical-align: middle;">v1.0</span>
        </span>
        <div class="d-flex gap-2 pe-3">
            <button id="btn-new" class="btn btn-outline-danger btn-sm me-2">
                <i class="bi bi-trash"></i> NEW DESIGN
            </button>
            <button id="btn-restore" class="btn btn-outline-warning btn-sm">
                <i class="bi bi-arrow-counterclockwise"></i> RESTORE AUTOSAVE
            </button>
            <button id="btn-import" class="btn btn-outline-neon-magenta btn-sm">
                <i class="bi bi-download"></i> IMPORT JSON
            </button>
            <button id="btn-export" class="btn btn-neon-cyan btn-sm">
                <i class="bi bi-upload"></i> EXPORT TEMPLATE
            </button>
        </div>
    </div>
</nav>

<div class="container-fluid h-100 p-0 overflow-hidden">
    <div class="row g-0 h-100" style="min-height: calc(100vh - 56px);">
        <!-- Sidebar Controls -->
        <div class="col-md-4 col-lg-3 bg-black border-end border-secondary overflow-y-auto p-3 h-100" style="max-height: calc(100vh - 56px);">
            
            <div class="mb-4">
                <label class="form-label small text-secondary" style="font-family: 'Orbitron', sans-serif;">DESIGNER UTILITIES</label>
                <button id="btn-download-blank" class="btn btn-outline-secondary btn-sm w-100 mb-2 text-start">
                    <i class="bi bi-file-earmark-image me-2"></i> DOWNLOAD PS TEMPLATE
                </button>
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="grid-toggle">
                    <label class="form-check-label small text-secondary" for="grid-toggle">Show Grid Overlay</label>
                </div>
                <div class="alert alert-dark border-secondary p-2 mb-0" style="font-size: 0.7rem; background: rgba(255,255,255,0.02);">
                    <i class="bi bi-info-circle-fill text-neon-cyan me-1"></i> <strong>NOTE:</strong> For full card coverage, use images exactly <strong>500 x 700 pixels</strong>.
                </div>
            </div>

            <hr class="border-secondary opacity-25">

            <div class="mb-4">
                <label class="form-label small text-secondary" style="font-family: 'Orbitron', sans-serif;">CUSTOM FONTS (.WOFF2)</label>
                <input type="file" id="font-upload" class="form-control form-control-sm mb-2" accept=".woff2">
                <ul id="custom-fonts-list" class="list-group list-group-sm" style="font-size: 0.75rem;"></ul>
            </div>

            <hr class="border-secondary opacity-25">
            
            <div class="mb-4">
                <label class="form-label small text-secondary" style="font-family: 'Orbitron', sans-serif;">SELECT CARD LEVEL</label>
                <div class="btn-group w-100 shadow-sm mb-3" role="group">
                    <input type="radio" class="btn-check" name="level-select" id="lv1" value="1" checked>
                    <label class="btn btn-outline-secondary py-2" for="lv1">1</label>
                    
                    <input type="radio" class="btn-check" name="level-select" id="lv2" value="2">
                    <label class="btn btn-outline-secondary py-2" for="lv2">2</label>
                    
                    <input type="radio" class="btn-check" name="level-select" id="lv3" value="3">
                    <label class="btn btn-outline-secondary py-2" for="lv3">3</label>
                    
                    <input type="radio" class="btn-check" name="level-select" id="lv4" value="4">
                    <label class="btn btn-outline-secondary py-2" for="lv4">4</label>
                    
                    <input type="radio" class="btn-check" name="level-select" id="lv5" value="5">
                    <label class="btn btn-outline-secondary py-2" for="lv5">5</label>
                </div>

                <div class="input-group input-group-sm">
                    <select id="copy-source-level" class="form-select bg-secondary text-white border-secondary">
                        <option value="">Copy From...</option>
                        <option value="1">Level 1</option>
                        <option value="2">Level 2</option>
                        <option value="3">Level 3</option>
                        <option value="4">Level 4</option>
                        <option value="5">Level 5</option>
                    </select>
                    <button id="btn-copy-level" class="btn btn-neon-cyan text-white fw-bold">COPY</button>
                </div>
            </div>

            <hr class="border-secondary opacity-25">

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label small text-secondary mb-0" style="font-family: 'Orbitron', sans-serif;">LAYER ORDER (Z-INDEX)</label>
                    <i class="bi bi-info-circle text-secondary" style="cursor: help;" title="Drag to reorder layers. Top layer in list is foreground."></i>
                </div>
                <div id="layer-list" class="list-group">
                    <!-- Dynamic Layer List -->
                </div>
            </div>

            <hr class="border-secondary opacity-25">

            <!-- Active Layer Settings (Dynamic) -->
            <div id="layer-settings">
                <div class="text-center text-secondary py-4">
                    <i class="bi bi-layers-fill d-block mb-2 fs-3"></i>
                    Select a layer to edit settings
                </div>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="col-md-8 col-lg-9 d-flex flex-column align-items-center justify-content-center p-4 bg-dark-blue">
            <div class="canvas-container shadow-lg">
                <!-- 500x700 base resolution -->
                <canvas id="studio-canvas" width="500" height="700"></canvas>
                <div id="canvas-overlay"></div>
            </div>
            <div class="mt-3 text-secondary small">
                <span class="me-3"><i class="bi bi-mouse me-1"></i> Drag elements on canvas to reposition</span>
                <span><i class="bi bi-aspect-ratio me-1"></i> Resolution: 500 x 700</span>
            </div>
        </div>
    </div>
</div>

<!-- Modal for JSON Import -->
<div class="modal fade" id="importModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-black border border-neon-magenta text-light">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" style="font-family: 'Orbitron', sans-serif;">IMPORT TEMPLATE JSON</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="file" id="import-file-input" class="form-control bg-dark text-light border-secondary" accept=".json">
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="btn-do-import" class="btn btn-neon-magenta">Process Import</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/renderer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
