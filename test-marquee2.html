<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
    .team-name-container {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        position: relative;
    }
    .team-name-scroll {
        display: inline-block;
        white-space: nowrap;
        animation: team-marquee 10s linear infinite;
    }
    .team-name-scroll:hover {
        animation-play-state: paused;
    }
    @keyframes team-marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }
    .orbitron { font-family: sans-serif; font-weight: bold; }
    .text-cyan { color: cyan; }
</style>
</head>
<body class="bg-dark text-white p-5">
    <div class="row">
        <div class="col-6" style="min-width:0">
            <div class="text-center mb-4 team-name-container" 
                 x-data="{ overflowing: false }" 
                 x-init="$nextTick(() => { overflowing = $refs.naked.offsetWidth > $el.clientWidth; })" 
                 @resize.window="overflowing = $refs.naked.offsetWidth > $el.clientWidth">
                <div :class="{ 'team-name-scroll': overflowing }">
                    <h4 class="orbitron text-cyan mb-0 d-inline-block" :class="{ 'pe-5': overflowing }">
                        <span x-ref="naked">Team Short</span>
                    </h4>
                    <h4 x-show="overflowing" class="orbitron text-cyan mb-0 d-inline-block pe-5">
                        Team Short
                    </h4>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
